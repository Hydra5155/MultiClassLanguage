<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Thuyết Minh Đa Ngôn Ngữ</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 30px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h1 { margin-top: 0; font-size: 24px; color: #1a202c; text-align: center; }
    .filter-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
    select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
    .card { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.04); }
    .card h3 { margin: 0 0 8px 0; font-size: 18px; color: #1e293b; }
    .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #e0e7ff; color: #3730a3; margin-bottom: 8px; }
    .transcript { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 12px; }
    audio { width: 100%; height: 36px; outline: none; }
    .loading { text-align: center; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hệ Thống Thuyết Minh Âm Thanh</h1>
    
    <div class="filter-bar">
      <span>Chọn ngôn ngữ:</span>
      <select id="langSelect" onchange="loadGuides()">
        <option value="">Tất cả ngôn ngữ</option>
        <option value="vi">Tiếng Việt (vi)</option>
        <option value="en">English (en)</option>
      </select>
    </div>

    <div id="guideList" class="loading">Đang tải dữ liệu từ máy chủ...</div>
  </div>

  <script>
    const API_URL = "https://mutilclasslanguage.onrender.com/api/AudioGuides";

    async function loadGuides() {
      const container = document.getElementById("guideList");
      const lang = document.getElementById("langSelect").value;
      container.innerHTML = '<div class="loading">Đang tải dữ liệu...</div>';

      try {
        const url = lang ? `${API_URL}?lang=${lang}` : API_URL;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error("Không thể kết nối đến máy chủ API");
        }

        const data = await response.json();

        if (data.length === 0) {
          container.innerHTML = '<div class="loading">Không tìm thấy nội dung phù hợp.</div>';
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="card">
            <span class="badge">${item.languageCode.toUpperCase()}</span>
            <h3>${item.title}</h3>
            <p class="transcript">${item.transcript}</p>
            <audio controls src="${item.audioUrl}">Trình duyệt không hỗ trợ phát âm thanh.</audio>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<div class="loading" style="color: #ef4444;">Lỗi: ${err.message}. (Kiểm tra lại cấu hình CORS trên Web API nếu bị chặn truy vấn).</div>`;
      }
    }

    // Tự động tải danh sách khi mở trang
    loadGuides();
  </script>
</body>
</html>
